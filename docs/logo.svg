<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Tollgate logo">
  <!-- ground -->
  <rect x="18" y="98" width="92" height="8" rx="4" fill="#0071e3"/>
  <!-- pivot post -->
  <rect x="30" y="44" width="12" height="58" rx="4" fill="#0071e3"/>
  <circle cx="36" cy="46" r="7" fill="#0071e3"/>
  <!-- raised boom barrier, striped, pivoting up-right -->
  <g transform="rotate(-32 36 46)">
    <rect x="36" y="40" width="78" height="12" rx="6" fill="#ffffff" stroke="#0071e3" stroke-width="3"/>
    <rect x="46" y="41.5" width="9" height="9" fill="#d11f2d"/>
    <rect x="66" y="41.5" width="9" height="9" fill="#d11f2d"/>
    <rect x="86" y="41.5" width="9" height="9" fill="#d11f2d"/>
    <rect x="106" y="41.5" width="6" height="9" fill="#d11f2d"/>
  </g>
</svg>
