# Tollgate example policy.
# Two API keys, then a route table ordered from most to least specific.
# The parser ignores comments and blank lines. Run it with:
#   tollgate check examples/gateway.conf --host api.example.com --path /v1/users/42 --key svc-reader

key svc-reader scopes read:users,read:orders
key svc-admin  scopes read:users,read:orders,write:users

# Exact path wins over the param and prefix routes below.
route {
  method GET
  host api.example.com
  path /v1/health
  upstream 127.0.0.1:9001
}

# :id param template. Requires a key with the read:users scope, 5 req/s, burst 10.
route {
  method GET
  host api.example.com
  path /v1/users/:id
  auth scope read:users
  rate 5/s burst 10
  upstream 127.0.0.1:9002
  strip_prefix /v1
  set_header X-Tollgate proxied
  remove_header X-Internal-Debug
}

# Writes need the write:users scope and are throttled harder.
route {
  method POST
  host api.example.com
  path /v1/users
  auth scope write:users
  rate 1/s burst 2
  upstream 127.0.0.1:9002
  strip_prefix /v1
}

# Everything else under this host is an anonymous, IP-rate-limited catch-all.
route {
  host api.example.com
  path /*
  rate 20/s burst 40
  upstream 127.0.0.1:9003
}
